name: Build RPGF Engineering Suite

on:
  push:

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ============================================================
  # BUILD WINDOWS EXE
  # ============================================================

  build-windows:

    name: Build Windows EXE

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean "RPGF Engineering Suite.spec"

      - name: Show build output
        shell: powershell
        run: |
          Write-Host "===== DIST CONTENTS ====="
          Get-ChildItem -Recurse .\dist | Format-Table FullName, Length

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v6
        with:
          name: RPGF-Engineering-Suite-Windows
          path: "dist/RPGF Engineering Suite.exe"
          if-no-files-found: error
