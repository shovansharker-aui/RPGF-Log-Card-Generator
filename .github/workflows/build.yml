name: Build and Release RPGF Engineering Suite

on:
  push:
    branches:
      - main

    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  # ============================================================
  # BUILD WINDOWS EXE
  # ============================================================

  build-windows:

    name: Build Windows EXE

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean "RPGF Engineering Suite.spec"

      - name: Show build output
        shell: powershell
        run: |
          Write-Host "===== DIST CONTENTS ====="
          Get-ChildItem -Recurse .\dist | Format-Table FullName, Length

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v6
        with:
          name: RPGF-Engineering-Suite-Windows
          path: "dist/RPGF Engineering Suite.exe"
          if-no-files-found: error


  # ============================================================
  # CREATE GITHUB RELEASE
  # ============================================================

  release:

    name: Create GitHub Release

    runs-on: ubuntu-latest

    needs:
      - build-windows

    # Only create a Release when a version tag is pushed.
    # Example: v2.0.0
    if: startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Download Windows EXE
        uses: actions/download-artifact@v7
        with:
          name: RPGF-Engineering-Suite-Windows
          path: release

      - name: Show downloaded files
        run: |
          echo "===== RELEASE CONTENTS ====="
          find release -type f -maxdepth 3 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RPGF Engineering Suite ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/RPGF Engineering Suite.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}